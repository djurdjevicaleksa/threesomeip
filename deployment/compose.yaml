services:
  ecu1:
    build: ./ecu1
    container_name: ecu1_container
    networks:
      someip_net:
        ipv4_address: 10.10.0.2
    volumes:
      - ./someip.json:/etc/someip.json:ro
    entrypoint: ["sleep", "infinity"]
    stdin_open: true
    tty: true

  ecu2:
    build: ./ecu2
    container_name: ecu2_container
    networks:
      someip_net:
        ipv4_address: 10.10.0.3
    volumes:
      - ./someip.json:/etc/someip.json:ro
    entrypoint: ["sleep", "infinity"]
    stdin_open: true
    tty: true

networks:
  someip_net:
    driver: bridge
    ipam:
      config:
        - subnet: 10.10.0.0/24
          gateway: 10.10.0.1